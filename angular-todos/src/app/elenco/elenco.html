<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Elenco Todos</h2>
    <span class="badge text-bg-primary fs-6">
      Completati: {{ totaleCompletati() }} / {{ todoService.todos().length }}
    </span>
  </div>
  
  <!-- Form POST per creare un nuovo todo -->
  <div class="input-group mb-3">
    <input #nuovoTitolo type="text" class="form-control" placeholder="Scrivi un nuovo todo...">
    <button
      type="button"
      class="btn btn-success"
      [disabled]="todoService.loading()"
      (click)="aggiungi(nuovoTitolo)">
      Aggiungi
    </button>
  </div>
  
  <!-- Filtro -->
  <div class="form-check mb-3">
    <input
      class="form-check-input"
      type="checkbox"
      id="filtroDaFare"
      [checked]="soloDaFare()"
      (change)="soloDaFare.set(!soloDaFare())">
    <label class="form-check-label" for="filtroDaFare">
      Mostra solo quelli da fare
    </label>
  </div>
  
  <!-- Indicatore di caricamento -->
  @if (todoService.loading()) {
    <div class="spinner-border text-primary mb-3" role="status"></div>
  }
  
  <!-- Messaggio di errore -->
  @if (todoService.errore(); as msg) {
    <div class="alert alert-danger">{{ msg }}</div>
  }
  
  <!-- Lista dei todos -->
  <div class="list-group">
    @for (t of todosVisibili(); track $index) {
      <a
        [routerLink]="['/todos', t.id]"
        class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <span><strong>#{{ t.id }}</strong> - {{ t.title }}</span>
        @if (t.completed) {
          <span class="badge text-bg-success">Completato</span>
        } @else {
          <span class="badge text-bg-warning">Da fare</span>
        }
      </a>
    }
  </div>
