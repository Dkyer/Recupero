<!-- Titolo e conteggio calcolato con computed -->
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Elenco Todos</h1>
  <span class="text-secondary small">Totale: {{ totaleTodos() }}</span>
</div>

<!-- Form minimale per creare un nuovo todo (POST) -->
<div class="input-group mb-4">
  <input
    #nuovoTitolo
    type="text"
    class="form-control"
    placeholder="Nuovo todo...">
  <button
    type="button"
    class="btn btn-dark"
    [disabled]="todoService.loading()"
    (click)="aggiungi(nuovoTitolo)">
    Aggiungi
  </button>
</div>

<!-- Indicatore di caricamento -->
@if (todoService.loading()) {
  <div class="spinner-border spinner-border-sm text-secondary mb-3" role="status"></div>
}

<!-- Eventuale messaggio di errore -->
@if (todoService.errore(); as msg) {
  <div class="alert alert-danger py-2">{{ msg }}</div>
}

<!-- Lista minimale dei 100 todos -->
<div class="list-group">
  @for (t of todoService.todos(); track $index) {
    <a
      [routerLink]="['/todos', t.id]"
      class="list-group-item list-group-item-action">
      <span class="text-secondary me-2">#{{ t.id }}</span>
      <span>{{ t.title }}</span>
    </a>
  }
</div>
