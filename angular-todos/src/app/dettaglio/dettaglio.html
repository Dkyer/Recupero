<!-- Link per tornare alla lista -->
<a routerLink="/todos" class="text-decoration-none text-secondary small d-inline-block mb-3">
  &larr; Torna all'elenco
</a>

<h1 class="h4 mb-3">Dettaglio Todo #{{ idCorrente() }}</h1>

<!-- Indicatore di caricamento -->
@if (loading()) {
  <div class="spinner-border spinner-border-sm text-secondary my-3" role="status"></div>
}

<!-- Messaggio di errore (404 se inesistente, 0 se rete assente) -->
@if (errore(); as msg) {
  <div class="alert alert-danger py-2 my-3">{{ msg }}</div>
}

<!-- Riquadro con i dati del singolo todo -->
@if (todo(); as t) {
  <div class="bg-white border rounded p-3 my-3">
    <p class="fw-semibold mb-2">{{ t.title }}</p>
    <p class="text-secondary small mb-0">
      ID: {{ t.id }} &bull; Utente: {{ t.userId }}
    </p>
  </div>
}

<!-- Pulsanti Precedente e Successivo -->
<div class="d-flex justify-content-between mt-4">
  <button
    type="button"
    class="btn btn-outline-dark btn-sm"
    [disabled]="idCorrente() <= 1 || loading()"
    (click)="precedente()">
    &laquo; Precedente
  </button>

  <button
    type="button"
    class="btn btn-outline-dark btn-sm"
    [disabled]="loading()"
    (click)="successivo()">
    Successivo &raquo;
  </button>
</div>
